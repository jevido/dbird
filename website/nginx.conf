server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff always;
    }

    # Short install links: curl -fsSL https://dbird.jevido.app/install.sh | sh
    location = /install.sh { return 302 https://raw.githubusercontent.com/jevido/dbird/main/install.sh; }
    location = /install.ps1 { return 302 https://raw.githubusercontent.com/jevido/dbird/main/install.ps1; }
}
