name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  WAILS_VERSION: v3.0.0-beta.18

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Go tests
        run: go test -race ./internal/...

      - name: PostgreSQL integration tests
        run: go test -tags integration ./internal/dbx/

      - name: Build (frontend + bindings + binary)
        run: wails3 build

      - name: Updater tests
        run: go test -run TestMatchAsset .

      - name: Svelte check
        working-directory: frontend
        run: npx svelte-check --tsconfig ./tsconfig.json --fail-on-warnings
