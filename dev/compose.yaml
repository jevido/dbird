# Sample databases for trying dbird locally.
#   task dev:db:up     start (first start seeds the data)
#   task dev:db:down   stop and delete the data
name: dbird-dev

services:
  postgres:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_USER: dbird
      POSTGRES_PASSWORD: dbird
      POSTGRES_DB: shop
    ports:
      - "127.0.0.1:54320:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbird -d shop"]
      interval: 2s
      retries: 30

  mysql:
    image: docker.io/library/mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: dbird
      MYSQL_USER: dbird
      MYSQL_PASSWORD: dbird
      MYSQL_DATABASE: shop
    ports:
      - "127.0.0.1:33061:3306"
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-udbird", "-pdbird"]
      interval: 2s
      retries: 60
