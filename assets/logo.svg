<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26324f"/>
      <stop offset="1" stop-color="#121829"/>
    </linearGradient>
    <linearGradient id="db" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f6fd6"/>
      <stop offset="0.55" stop-color="#5b8def"/>
      <stop offset="1" stop-color="#3a62c4"/>
    </linearGradient>
    <linearGradient id="dbtop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9c4ff"/>
      <stop offset="1" stop-color="#7ea3f7"/>
    </linearGradient>
    <linearGradient id="bird" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffc15e"/>
      <stop offset="1" stop-color="#ff7a3d"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f06a2e"/>
      <stop offset="1" stop-color="#d9531c"/>
    </linearGradient>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#bg)"/>

  <!-- database cylinder -->
  <g>
    <path d="M232 590 v220 a280 78 0 0 0 560 0 v-220 z" fill="url(#db)"/>
    <path d="M240 666 a272 76 0 0 0 544 0" fill="none" stroke="#2c4fa6" stroke-width="12" stroke-linecap="round" opacity="0.75"/>
    <path d="M240 740 a272 76 0 0 0 544 0" fill="none" stroke="#2c4fa6" stroke-width="12" stroke-linecap="round" opacity="0.75"/>
    <ellipse cx="512" cy="590" rx="280" ry="78" fill="url(#dbtop)"/>
  </g>

  <!-- bird -->
  <g>
    <!-- legs -->
    <path d="M478 560 l-10 44 M538 560 l10 44" stroke="#e25a20" stroke-width="16" stroke-linecap="round"/>
    <!-- tail -->
    <path d="M370 470 C 320 440, 270 410, 220 380 C 240 440, 262 490, 300 520 C 330 510, 355 495, 370 470 Z" fill="url(#wing)"/>
    <!-- body -->
    <ellipse cx="505" cy="440" rx="178" ry="150" fill="url(#bird)"/>
    <!-- belly -->
    <ellipse cx="540" cy="490" rx="112" ry="82" fill="#ffd89a" opacity="0.9"/>
    <!-- wing -->
    <path d="M548 402 C 520 340, 420 335, 372 392 C 340 430, 322 470, 300 505 C 360 500, 430 488, 490 462 C 530 445, 556 428, 548 402 Z" fill="url(#wing)"/>
    <!-- beak -->
    <path d="M668 392 L748 418 L668 446 Z" fill="#ffcf4a"/>
    <!-- eye -->
    <circle cx="600" cy="378" r="30" fill="#ffffff"/>
    <circle cx="610" cy="380" r="15" fill="#121829"/>
    <circle cx="615" cy="374" r="5" fill="#ffffff"/>
  </g>
</svg>
